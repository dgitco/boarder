name: CLA

# Every pull request author signs the CLA once (CLA.md). Signatures live on the cla-signatures branch of this repo.
# pull_request_target runs with this repo's token but never checks out the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # contributor-assistant/github-action v2.6.1, pinned to its commit
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/dgitco/boarder/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dgitco,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          create-file-commit-message: Create the CLA signature file
          signed-commit-message: $contributorName signed the CLA in $owner/$repo#$pullRequestNo
          custom-notsigned-prcomment: Thanks for the pull request! Before it can be merged, please read the [Contributor License Agreement](https://github.com/dgitco/boarder/blob/main/CLA.md) and sign it by posting the comment below. You only sign once, and it covers all your contributions.
          custom-allsigned-prcomment: Everyone on this pull request has signed the CLA. Thanks!
