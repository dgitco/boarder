#pushsheet .ps-nh{display:flex;align-items:baseline;gap:8px}

#pushsheet .ps-ico{width:52px;height:52px;border-radius:14px;margin:26px auto 0;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
#pushsheet .ps-ico svg{width:26px;height:26px}
#pushsheet .ps-body{padding:20px 22px 22px}
#pushsheet h2{margin:0 0 8px;font-size:21px;line-height:1.3;font-weight:700;color:var(--ink)}

#pushsheet p{margin:0;color:var(--soft);font-size:14.5px;line-height:1.5}
#pushsheet ol{margin:12px 0 0;padding-left:20px;color:var(--ink);font-size:14.5px;line-height:1.6}
#pushsheet .ps-msg{margin-top:10px;color:var(--danger);font-size:13px}
#pushsheet .ps-btns{display:flex;flex-direction:column;gap:8px;margin-top:20px}
#pushsheet .ps-btns button{border:0;border-radius:999px;padding:13px 16px;font:inherit;font-size:15.5px;font-weight:600;cursor:pointer}
#pushsheet .ps-go{background:var(--ink);color:var(--surface)}
#pushsheet .ps-later{background:var(--sunk);color:var(--soft)}
#pushsheet .ps-card:focus,#pushsheet button:focus:not(:focus-visible){outline:none}   
#pushsheet button:focus-visible{outline:1.5px solid var(--muted);outline-offset:2px;border-radius:999px}
#pushsheet .ps-btns button:disabled{opacity:.55;cursor:default}
#pushsheet .ps-btns button:has(.ps-spin){opacity:1}
.ps-spin{display:inline-block;vertical-align:middle;width:18px;height:18px;border-width:2px}
.ps-go .ps-spin{border-color:color-mix(in srgb,var(--surface) 35%,transparent);border-top-color:var(--surface)}
#pushp .pri .ps-spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
#pushsheet .ps-grab{display:none}
@media (max-width:640px){
  #pushsheet{place-items:end stretch;padding:0}
  #pushsheet .ps-card{width:100%;border-radius:22px 22px 0 0;transition:transform .2s ease;touch-action:pan-y;padding-bottom:env(safe-area-inset-bottom,0px);animation:ps-up .28s cubic-bezier(.2,.8,.2,1)}
  #pushsheet .ps-card .ps-x{display:none}   
  #pushsheet .ps-card.drag{transition:none}
  #pushsheet .ps-grab{display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;position:absolute;left:50%;transform:translateX(-50%);top:0}
}

.ibdd button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.ibdd button:hover,.ibdd button:focus-visible{background:var(--hover);outline:none}
.ibdd svg,.ibsheet svg{flex:none;color:var(--soft)}.ibdd svg{width:16px;height:16px}
.ibdd .iblab,.ibsheet .iblab{padding:6px 10px 2px;font-size:11.5px;color:var(--muted)}
.ibdd .ibsep,.ibsheet .ibsep{height:1px;margin:4px 6px;background:var(--line)}
.ibdd .ibr,.ibsheet .ibr{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--soft);font-style:normal;font-size:12.5px;white-space:nowrap}
.ibsheet .sl{border-top:0;padding-top:0}.ibsheet .sl button{gap:14px}
.ibsheet .iblab{padding:4px 6px 2px;font-size:12.5px}
.inbr.ibdn{opacity:.55}.inbr.ibdn .ud,.inbr.ibdn .un{display:none}


html.hb-unkeep .inbr.ibdn{opacity:1}
html.hb-unkeep .ibi{position:relative}

.ibfeed > .ibrdh{margin-top:18px;border-top:1px solid var(--line)}
.ibfeed > .ibrdl{box-sizing:border-box;width:calc(100% - 32px);max-width:calc(var(--col) - 32px);margin:4px auto 16px}
.ibrdl .inbr .ih b{font-weight:500}

.ibi.ibgo,.inbr.ibgo{box-shadow:0 0 0 2px var(--accent);transition:box-shadow .6s}
@media (max-width:640px){.ibfeed > .ibrdl{width:calc(100% - 20px)}}
.ibun{flex:none;align-self:center;margin-left:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;line-height:1.4;cursor:pointer;white-space:nowrap}
html.hb-unkeep .inbr:first-child:has(> .ibun) .rtools{right:132px}   
.ibi > .ibun{position:absolute;top:8px;right:12px;z-index:2;margin:0}
.ibi > .ibun + * .tools{right:132px}   
.ibun .ibun-a{display:none}
.ibun:hover,.ibun:focus-visible{color:var(--ink);border-color:var(--muted)}
.ibun:hover .ibun-r,.ibun:focus-visible .ibun-r{display:none}
.ibun:hover .ibun-a,.ibun:focus-visible .ibun-a{display:inline}
@media (hover:none){.ibun .ibun-r{display:none}.ibun .ibun-a{display:inline}}

#ibptr{position:fixed;left:50%;transform:translateX(-50%);z-index:65;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--surface);box-shadow:0 4px 16px var(--shadow),0 0 0 1px var(--line);color:var(--muted);font-size:13px;pointer-events:none;transition:opacity .12s}
#ibptr[hidden]{display:none}
#ibptr b:empty{display:none}   
#ibptr i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent,#3b82f6)}
#ibptr.spin i{animation:ibptrspin .7s linear infinite}
@keyframes ibptrspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#ibptr.spin i{animation:none}}
